<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F.R.I.D.A.Y. Voice UI</title>
  <style>
    :root {
      --friday-deep: #0B0E14;
      --friday-bg: #111620;
      --friday-surface: #1A1F2E;
      --friday-amber: #F5A623;
      --friday-amber-light: #FFCC66;
      --friday-copper: #E8852A;
      --friday-text: #E8E0D4;
      --friday-text-dim: #7A7262;
      --friday-error: #F87171;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(ellipse at center, #0B0E14 0%, #080A0F 100%);
      color: var(--friday-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Vignette overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.6) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .title {
      letter-spacing: 0.3em;
      color: var(--friday-amber);
      font-size: 1.4rem;
      font-weight: 300;
      user-select: none;
      z-index: 2;
      margin-bottom: 4px;
    }

    .subtitle {
      color: var(--friday-text-dim);
      font-size: 0.85rem;
      z-index: 2;
      margin-bottom: 16px;
    }

    .canvas-container {
      width: min(50vh, 50vw);
      height: min(50vh, 50vw);
      position: relative;
      z-index: 2;
    }

    .canvas-container canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .status-text {
      text-align: center;
      color: var(--friday-text-dim);
      font-size: 0.9rem;
      min-height: 1.4em;
      margin-top: 16px;
      opacity: 0;
      transition: opacity 300ms ease;
      z-index: 2;
    }

    .status-text.visible {
      opacity: 1;
    }

    /* Ellipsis animation */
    .ellipsis span {
      opacity: 0;
      animation: ellipsisFade 1.4s infinite;
    }

    .ellipsis span:nth-child(1) {
      animation-delay: 0s;
    }

    .ellipsis span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .ellipsis span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes ellipsisFade {
      0%, 80%, 100% { opacity: 0; }
      40% { opacity: 1; }
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 32px;
      z-index: 2;
    }

    .pill-btn {
      background: transparent;
      border: 1px solid var(--friday-amber);
      color: var(--friday-amber);
      padding: 8px 20px;
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 200ms ease, color 200ms ease;
      user-select: none;
    }

    .pill-btn:hover {
      background: var(--friday-amber);
      color: var(--friday-deep);
    }

    .pill-btn.end {
      border-color: var(--friday-error);
      color: var(--friday-error);
    }

    .pill-btn.end:hover {
      background: var(--friday-error);
      color: var(--friday-deep);
    }

    .dev-controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
      background: var(--friday-surface);
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid rgba(245, 166, 35, 0.15);
    }

    .state-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--friday-text-dim);
      background: transparent;
      color: var(--friday-text-dim);
      font-size: 0.55rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 200ms ease, color 200ms ease;
    }

    .state-btn:hover {
      border-color: var(--friday-amber);
      color: var(--friday-amber);
    }

    .state-btn.active {
      border-color: var(--friday-amber);
      background: var(--friday-amber);
      color: var(--friday-deep);
    }

    .dev-separator {
      width: 1px;
      height: 20px;
      background: var(--friday-text-dim);
      opacity: 0.3;
    }

    .resume-btn {
      background: transparent;
      border: 1px solid var(--friday-text-dim);
      color: var(--friday-text-dim);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.7rem;
      cursor: pointer;
      transition: border-color 200ms ease, color 200ms ease;
    }

    .resume-btn:hover {
      border-color: var(--friday-amber);
      color: var(--friday-amber);
    }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .speed-control input[type="range"] {
      width: 80px;
      accent-color: var(--friday-amber);
    }

    .speed-label {
      color: var(--friday-text-dim);
      font-size: 0.7rem;
      min-width: 30px;
    }
  </style>
</head>
<body>
  <div class="title">F.R.I.D.A.Y.</div>
  <div class="subtitle">Eve &middot; On</div>

  <div class="canvas-container">
    <canvas id="orb"></canvas>
  </div>

  <div id="status" class="status-text">
    Listening<span class="ellipsis"><span>.</span><span>.</span><span>.</span></span>
  </div>

  <div class="controls">
    <button class="pill-btn" id="btn-whisper">Whisper</button>
    <button class="pill-btn" id="btn-mute">Mute</button>
    <button class="pill-btn end" id="btn-end">End Session</button>
  </div>

  <div class="dev-controls">
    <button class="state-btn active" data-state="idle">IDLE</button>
    <button class="state-btn" data-state="listening">LIST</button>
    <button class="state-btn" data-state="thinking">THNK</button>
    <button class="state-btn" data-state="speaking">SPKR</button>
    <div class="dev-separator"></div>
    <button class="resume-btn" id="btn-resume">Resume</button>
    <div class="dev-separator"></div>
    <div class="speed-control">
      <input type="range" id="speed-slider" min="0.5" max="3" step="0.1" value="1">
      <span class="speed-label" id="speed-label">1.0x</span>
    </div>
  </div>

  <script>
    // --- Constants ---
    const COLORS = {
      deep: '#0B0E14',
      amber: '#F5A623',
      amberLight: '#FFCC66',
      copper: '#E8852A',
      text: '#E8E0D4',
      textDim: '#7A7262',
      error: '#F87171',
    };
    const PARTICLE_COUNT = 150;
    const SPHERE_RADIUS = 0.35; // fraction of canvas size

    // --- Particle class ---
    class Particle {
      constructor(index) {
        const golden = Math.PI * (3 - Math.sqrt(5));
        const y = 1 - (index / (PARTICLE_COUNT - 1)) * 2;
        const radiusAtY = Math.sqrt(1 - y * y);
        const theta = golden * index;

        this.homeX = Math.cos(theta) * radiusAtY;
        this.homeY = y;
        this.homeZ = Math.sin(theta) * radiusAtY;

        this.x = this.homeX;
        this.y = this.homeY;
        this.z = this.homeZ;

        this.vx = 0;
        this.vy = 0;
        this.vz = 0;

        this.baseSize = 1.5 + Math.random() * 1.5;
        this.size = this.baseSize;
        this.baseOpacity = 0.5 + Math.random() * 0.5;
        this.opacity = this.baseOpacity;
      }

      project(cx, cy, radius) {
        const perspective = 2;
        const scale = perspective / (perspective + this.z);
        const px = cx + this.x * radius * scale;
        const py = cy - this.y * radius * scale;
        const depth = (this.z + 1) / 2; // 0=back, 1=front
        return { px, py, depth, scale };
      }
    }

    // --- Canvas setup ---
    const canvas = document.getElementById('orb');
    const ctx = canvas.getContext('2d');
    let centerX, centerY, orbRadius;

    function resize() {
      const container = canvas.parentElement;
      const rect = container.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      centerX = rect.width / 2;
      centerY = rect.height / 2;
      orbRadius = Math.min(rect.width, rect.height) * SPHERE_RADIUS;
      ctx.fillStyle = COLORS.deep;
      ctx.fillRect(0, 0, rect.width, rect.height);
    }

    window.addEventListener('resize', resize);
    resize();

    // --- Initialize particles ---
    const particles = [];
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push(new Particle(i));
    }

    // --- State machine ---
    const STATES = { IDLE: 'idle', LISTENING: 'listening', THINKING: 'thinking', SPEAKING: 'speaking', ERROR: 'error' };
    let currentState = STATES.IDLE;
    let stateTransition = 1; // 0..1
    const TRANSITION_SPEED = 0.002; // ~500ms
    let speedMultiplier = 1;

    function setState(newState) {
      if (newState === currentState) return;
      currentState = newState;
      stateTransition = 0;
    }

    // --- Control state placeholders ---
    let whisperMode = false;
    let muted = false;
    let sessionEnded = false;

    // --- Particle physics ---
    function updateParticles(dt) {
      const time = performance.now() * 0.001;

      for (const p of particles) {
        let forceX = 0, forceY = 0, forceZ = 0;
        let targetSize = p.baseSize;
        let targetOpacity = p.baseOpacity;

        switch (currentState) {
          case STATES.IDLE: {
            // Spring force toward home
            forceX = (p.homeX - p.x) * 0.0005;
            forceY = (p.homeY - p.y) * 0.0005;
            forceZ = (p.homeZ - p.z) * 0.0005;
            targetOpacity = p.baseOpacity * 0.6;
            break;
          }

          case STATES.LISTENING: {
            // Contract inward: target is home * 0.8
            const lTargetX = p.homeX * 0.8;
            const lTargetY = p.homeY * 0.8;
            const lTargetZ = p.homeZ * 0.8;
            forceX = (lTargetX - p.x) * 0.001;
            forceY = (lTargetY - p.y) * 0.001;
            forceZ = (lTargetZ - p.z) * 0.001;
            // Vibration
            const vibration = Math.sin(time * 20 + p.homeX * 10) * 0.01 * 0.001;
            forceX += vibration;
            forceY += vibration;
            forceZ += vibration;
            targetOpacity = p.baseOpacity * 0.8;
            break;
          }

          case STATES.THINKING: {
            // Vortex swirl: tangential force perpendicular to angle from center
            const angle = Math.atan2(p.z, p.x);
            const tangentialForce = 0.003;
            forceX += -Math.sin(angle) * tangentialForce;
            forceZ += Math.cos(angle) * tangentialForce;
            // Weak home-seeking
            forceX += (p.homeX * 0.9 - p.x) * 0.0003;
            forceZ += (p.homeZ * 0.9 - p.z) * 0.0003;
            // Y-axis home force
            forceY += (p.homeY - p.y) * 0.0005;
            targetOpacity = p.baseOpacity * 0.9;
            break;
          }

          case STATES.SPEAKING: {
            // Expand outward with pulse
            const expandFactor = 1.3;
            const pulse = Math.sin(time * 6 + p.homeX * 5) * 0.15;
            const targetDist = expandFactor + pulse;
            const sTargetX = p.homeX * targetDist;
            const sTargetY = p.homeY * targetDist;
            const sTargetZ = p.homeZ * targetDist;
            forceX = (sTargetX - p.x) * 0.001;
            forceY = (sTargetY - p.y) * 0.001;
            forceZ = (sTargetZ - p.z) * 0.001;
            targetSize = p.baseSize * 1.3;
            targetOpacity = 0.8 + Math.sin(time * 4) * 0.2;
            break;
          }

          case STATES.ERROR: {
            if (stateTransition < 0.3) {
              // Scatter with random force
              forceX = (Math.random() - 0.5) * 0.005;
              forceY = (Math.random() - 0.5) * 0.005;
              forceZ = (Math.random() - 0.5) * 0.005;
            } else {
              // Reconverge toward home
              forceX = (p.homeX - p.x) * 0.0008;
              forceY = (p.homeY - p.y) * 0.0008;
              forceZ = (p.homeZ - p.z) * 0.0008;
            }
            targetOpacity = p.baseOpacity * 0.5;
            break;
          }
        }

        // Whisper modifier
        if (whisperMode) {
          targetSize *= 0.6;
          targetOpacity *= 0.5;
        }

        // Mute modifier
        if (muted) {
          forceX = 0;
          forceY = 0;
          forceZ = 0;
          targetOpacity *= 0.3;
        }

        // Apply forces * dt + micro-jitter
        p.vx += forceX * dt + (Math.random() - 0.5) * 0.00002 * dt;
        p.vy += forceY * dt + (Math.random() - 0.5) * 0.00002 * dt;
        p.vz += forceZ * dt + (Math.random() - 0.5) * 0.00002 * dt;

        // Damping
        p.vx *= 0.97;
        p.vy *= 0.97;
        p.vz *= 0.97;

        // Update position from velocity
        p.x += p.vx;
        p.y += p.vy;
        p.z += p.vz;

        // Smooth lerp size and opacity
        p.size += (targetSize - p.size) * 0.05;
        p.opacity += (targetOpacity - p.opacity) * 0.05;
      }

      // Advance transition toward 1
      if (stateTransition < 1) {
        stateTransition = Math.min(1, stateTransition + TRANSITION_SPEED * dt);
      }
    }

    // --- Render loop ---
    let lastTime = performance.now();

    function render(now) {
      const dt = (now - lastTime) * speedMultiplier;
      lastTime = now;

      updateParticles(dt);

      const dpr = window.devicePixelRatio || 1;
      const w = canvas.width / dpr;
      const h = canvas.height / dpr;

      // Trail effect
      ctx.fillStyle = 'rgba(11, 14, 20, 0.15)';
      ctx.fillRect(0, 0, w, h);

      // Sort back to front
      particles.sort((a, b) => a.z - b.z);

      ctx.globalCompositeOperation = 'lighter';

      for (const p of particles) {
        const { px, py, depth, scale } = p.project(centerX, centerY, orbRadius);
        const size = p.size * scale * (orbRadius / 80);
        const alpha = p.opacity * (0.3 + depth * 0.7);

        if (size < 0.2) continue;

        const grad = ctx.createRadialGradient(px, py, 0, px, py, size * 2);
        grad.addColorStop(0, `rgba(245, 166, 35, ${alpha})`);
        grad.addColorStop(1, 'rgba(245, 166, 35, 0)');

        ctx.beginPath();
        ctx.arc(px, py, size * 2, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
      }

      ctx.globalCompositeOperation = 'source-over';

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);

    // --- Dev control buttons ---
    document.querySelectorAll('.state-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        setState(btn.dataset.state);
        document.querySelectorAll('.state-btn').forEach(b =>
          b.classList.toggle('active', b === btn)
        );
      });
    });
  </script>
</body>
</html>
